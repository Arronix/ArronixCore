name: Continuous integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Restore, build, test, and ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The compatibility ratchet needs the PR base or pre-push ledger, not a shallow clone.
          fetch-depth: 0

      - name: Install repository SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Run the clean-repository proof
        env:
          # PRs compare with their base; pushes compare with the revision before the push.
          ARRONIX_PREVIOUS_LEDGER_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: bash eng/ci/run-tests.sh

      - name: Upload test, compile-input, and compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-evidence-${{ github.run_attempt }}
          path: |
            artifacts/test-results
            artifacts/compile-inputs
            artifacts/compatibility
          if-no-files-found: warn
          retention-days: 14
